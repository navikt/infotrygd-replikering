name: PR build

on: [pull_request]

jobs:
  build:
    name: Bygg og test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set cache key
        run: |
          echo "CACHE_KEY=$(expr $(date +%V))" >> $GITHUB_ENV
          echo "TIMESTAMP=$(expr $(date +%Y%m%d%H%M%S))" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.CACHE_KEY }}

      - name: Build artifacts
        run: mvn verify

      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker-build-push
        with:
          team: infotrygd
          pull: true
          platforms: linux/amd64

      - name: Lagre image-referanse
        env:
          IMAGE: ${{ steps.docker-build-push.outputs.image }}
        run: printf '%s\n' "$IMAGE" > target/tested-image.txt

      - name: Test det pakkede container-imaget
        env:
          IMAGE: ${{ steps.docker-build-push.outputs.image }}
        run: mvn --batch-mode -Pcontainer-smoke -Dapp.image="$IMAGE" failsafe:integration-test failsafe:verify

      - name: Skann OS-pakker i container-imaget
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.docker-build-push.outputs.image }}
          scanners: vuln
          vuln-type: os
          format: json
          output: target/image-scan.json
          list-all-pkgs: 'true'
          exit-code: '0'

      - name: Kontroller CVE og komplett skannerapport
        run: bash scripts/check-image-scan.sh target/image-scan.json

      - name: Last opp skannerapport og testet image
        if: always() && hashFiles('target/image-scan.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-verification
          path: |
            target/image-scan.json
            target/tested-image.txt
          if-no-files-found: error
