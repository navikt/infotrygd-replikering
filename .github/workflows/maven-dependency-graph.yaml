name: Submit dependency graph
on:
  push:
    branches:
      - master
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - ".github/workflows/maven-dependency-graph.yaml"
  workflow_dispatch:
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          settings-path: ${{ runner.temp }}/maven-settings
      - name: Submit Dependency Snapshot (for dependabot)
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6
        with:
          settings-file: ${{ runner.temp }}/maven-settings/settings.xml
